schema: pvs-case/2
id: classical-physics-analytical-v1
version: 1.0.0
title: 'Classical analytical benchmarks: oscillator, heat diffusion and circular orbit'
description: Reproduce 36 independently frozen values for ideal problems. This demonstration verifies
  equations, not a production solver or experiment.
classifications:
- verification
- regression
subject:
  name: classical-analytical-demonstration
  version: 1.0.0
  description: Standard-library analytic equation evaluation; no production solver is executed.
execution:
  command:
  - python
  - derive_reference_values.py
  - --output
  - derived_values.json
  working_directory: .
  timeout_seconds: 30
  environment:
    PYTHONHASHSEED: '0'
  expected_exit_codes:
  - 0
artifacts:
