schema: pvs-case/2
id: fusion-reactivity-reference-v1
version: 1.0.0
title: 'Published fusion data: SI conversion and event-rate normalisation'
description: Thirty NRL2023 tabulated Maxwellian reactivities for DT, DD-total and D-He3. The sample
  adapter reads the published data and verifies conversion and pair counting; it does not predict physical
  reactivity.
classifications:
- verification
- regression
subject:
  name: public-fusion-table-adapter
  version: 1.0.0
  description: Original standard-library adapter of published input data; no independent reactivity
    model.
execution:
  command:
  - python
  - convert_reference_table.py
  - --output
  - derived_values.json
  working_directory: .
  timeout_seconds: 30
  expected_exit_codes:
  - 0
artifacts:
  adapter-source:
    path: convert_reference_table.py
    role: subject
    format: text
    expected_sha256: 6ba81884ec900b8b535c0648b787ff01a5d4aa987bc523c97e357bda56800e60
  published-table:
    path: published_table.json
    role: input
    format: json
    expected_sha256: 0dc789a3bdfbdadf4e56dd715b709c596af03853045849083f1364d74e9e8982
  mixture-inputs:
    path: inputs.json
    role: input
    format: json
    expected_sha256: e36736da355d6cdce329ffd02ea16702fd3c5b9dc18cf86359d4d2ac2b5f4314
  frozen-values:
    path: reference_values.json
    role: reference
    format: json
    expected_sha256: a5630f29ca4b006e4dd21c76f4a04c8667a7c646bd02d9e2853f79f56740c2ec
  values-schema:
    path: reference_values.schema.json
    role: reference
    format: json
    expected_sha256: 5f5f2d75a46e5eb86e26f50fb750f99d47237dd8515a8d8ca59005f5a9e118dd
  source-manifest:
    path: source_manifest.json
    role: reference
    format: json
    expected_sha256: 044e92bdc0eabe90ed14481ca256032ddf9298c0b7d480d301049ecd26b276c7
  derived-values:
    path: derived_values.json
    role: output
    format: json
references:
- id: nrl-2023
  type: published
  citation: A. Beresnyak, 2023 NRL Plasma Formulary (2023).
  locator: https://www.nrl.navy.mil/Portals/38/PDF%20Files/NRL_Plasma_Formulary_2023.pdf
  source_location: 'p.45: Maxwellian reaction-rate table, DT, DD-total and D-He3 columns'
  artifact: frozen-values
  accessed_utc: '2026-09-14'
  notes: Exact source bytes and displayed precision are recorded. These are approximate published reference
    values, not experimental observations with uncertainty bars.
- id: xie-2023-pair-counting
  type: published
  citation: H. Xie et al., arXiv:2212.01840v2 (2023).
  locator: https://arxiv.org/pdf/2212.01840v2
  source_location: p.2 Eq. (1)
  artifact: frozen-values
  accessed_utc: '2026-09-14'
  notes: Only elementary event counting is used; no reactivity model from the paper is imported.
