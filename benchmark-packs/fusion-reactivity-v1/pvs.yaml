package:
  embed_artifacts: true
  html: true
  pdf: true
metadata:
  source_byte_complete: true
  source_qualification_complete: true
  scope: Published table adapter and event-rate normalisation; no independent physical reactivity prediction
    or production solver.
  data_kind: published-tabulated-reference-and-derived-normalisation
  published_reference_values: 30
  derived_output_values: 60
  tolerance_policy: 2e-14 relative tolerance checks numeric transformations of printed values, not agreement
    of a physical model with uncertain measurements.
  limitations: Only three reaction channels at 10 published temperatures. DD is total, not branch-resolved.
    No interpolation, uncertainty bands or Maxwellian integration.
