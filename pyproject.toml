[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "physics-validation-suite"
version = "1.0.0a1"
description = "Portable, declarative and auditable evidence for scientific software validation and verification."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Chatwood Labs Ltd" },
]
keywords = [
  "scientific-computing",
  "validation",
  "verification",
  "provenance",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema[format-nongpl]>=4.23,<5",
  "numpy>=1.26,<2.3; python_version < '3.14'",
  "numpy>=2.3,<3; python_version >= '3.14'",
  "packaging>=24,<27",
  "pypdf>=6.18.1,<7",
  "PyYAML>=6.0,<7",
  "reportlab>=4.2,<5",
  "rfc8785>=0.1.4,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
netcdf = [
  "netCDF4>=1.7,<2",
]
all = [
  "netCDF4>=1.7,<2",
]
dev = [
  "build>=1.2,<2",
  "markdown-it-py>=3,<5",
  "mypy>=1.14,<2",
  "netCDF4>=1.7,<2",
  "pytest>=8.3,<8.4",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "setuptools>=77",
  "twine>=6,<7",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0,<7",
  "types-reportlab>=4.2,<5",
  "wheel>=0.45,<1",
]

[project.scripts]
pvs = "pvs.cli:main"

[project.urls]
Homepage = "https://chatwoodlabs.com"
Documentation = "https://github.com/chatwood-labs/physics-validation-suite/tree/v1.0.0-alpha.1/docs"
Issues = "https://github.com/chatwood-labs/physics-validation-suite/issues"
Source = "https://github.com/chatwood-labs/physics-validation-suite"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvs = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
# netCDF4's Cython extension emits this known, NumPy-version-independent warning
# when pytest installs its warnings filter: https://github.com/Unidata/netcdf4-python/issues/1354
filterwarnings = [
  'ignore:^numpy\.ndarray size changed, may indicate binary incompatibility\. Expected 16 from C header, got 96 from PyObject$:RuntimeWarning',
]
markers = [
  "windows_filesystem: real symlink or Windows reparse capability qualification",
  "distribution: builds and inspects release distributions",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/pvs/reporting/html.py" = ["E501"]
"src/pvs/reporting/legacy_v1_html.py" = ["E501"]
"src/pvs/reporting/legacy_v2_html.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["pvs"]
